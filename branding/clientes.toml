# ── Registro de marcas (white-label) ────────────────────────────────────────────
# Cada sección [<id>] define la marca de un cliente. El cliente activo se elige con
# la variable de entorno CLIENT_ID (por defecto: "default").
#
# Añadir un cliente nuevo = añadir una sección aquí (+ su logo). Cero cambios de código.
#
# Campos disponibles (todos opcionales; lo que falte hereda de [default]):
#   app_title     Título de la app y de la pestaña del navegador
#   page_icon     Emoji o ruta a imagen para el favicon
#   logo_path     Ruta (relativa a la raíz del proyecto) al logo. Vacío = sin logo
#   tagline       Texto bajo el título en la pantalla de setup
#   primary       Color principal (botones, acentos)
#   bg            Color de fondo de la app
#   secondary_bg  Color de fondo de elementos secundarios (sidebar, inputs)
#   text          Color del texto
#   font          Familia tipográfica CSS

[default]
app_title    = "BQ Agent"
page_icon    = "🤖"
logo_path    = ""
tagline      = "Conecta tu entorno de Google Cloud para consultar tus datos en lenguaje natural."
primary      = "#FF4B4B"
bg           = "#FFFFFF"
secondary_bg = "#F0F2F6"
text         = "#262730"
font         = "sans-serif"

[acme]
app_title    = "Acme Analytics"
page_icon    = "🔴"
logo_path    = "branding/logos/acme.svg"
tagline      = "Inteligencia de datos para Acme Corp."
primary      = "#E2231A"
bg           = "#FFFFFF"
secondary_bg = "#FBE9E7"
text         = "#1A1A1A"
font         = "'Segoe UI', sans-serif"

[globex]
